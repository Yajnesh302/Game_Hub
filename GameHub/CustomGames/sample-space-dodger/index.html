<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Dodger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #050814;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 720px;
            max-width: 95vw;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .hud-stat {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .hud-val {
            color: #38bdf8;
            font-size: 1.15rem;
        }

        .game-wrapper {
            position: relative;
            width: 720px;
            height: 520px;
            max-width: 95vw;
            max-height: 75vh;
            border: 2px solid #0284c7;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(2, 132, 199, 0.35);
            overflow: hidden;
            background: #020617;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 20, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #38bdf8;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .overlay-sub {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            max-width: 440px;
            line-height: 1.4;
        }

        .start-btn {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #040817;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transition: transform 0.15s ease;
        }

        .start-btn:hover {
            transform: scale(1.06);
        }
    </style>
</head>
<body>
    <div class="hud-bar">
        <div class="hud-stat">SCORE: <span class="hud-val" id="hud-score">0</span></div>
        <div class="hud-stat">SHIELD: <span class="hud-val" id="hud-shields" style="color: #34d399;">❤️❤️❤️</span></div>
        <div class="hud-stat">BEST: <span class="hud-val" id="hud-best" style="color: #fbbf24;">0</span></div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="720" height="520"></canvas>
        <div class="overlay-screen" id="start-overlay">
            <h1 class="overlay-title">SPACE DODGER</h1>
            <p class="overlay-sub">Pilot your craft, avoid asteroid hazards, and shoot down orbital targets! Controls: Mouse/Touch or Arrow Keys + Space to fire.</p>
            <button class="start-btn" id="start-btn">LAUNCH MISSION</button>
        </div>
    </div>

    <script>
        (function() {
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            var startOverlay = document.getElementById('start-overlay');
            var startBtn = document.getElementById('start-btn');
            var hudScore = document.getElementById('hud-score');
            var hudShields = document.getElementById('hud-shields');
            var hudBest = document.getElementById('hud-best');

            var isPlaying = false;
            var score = 0;
            var highScore = 0;
            var shields = 3;

            try { highScore = parseInt(localStorage.getItem('space_dodger_high') || 0, 10); } catch(e) {}
            hudBest.innerText = highScore;

            var ship = { x: 360, y: 440, w: 32, h: 36, speed: 7, vx: 0 };
            var keys = {};
            var lasers = [];
            var asteroids = [];
            var particles = [];
            var stars = [];

            // Spawn background stars
            for (var i = 0; i < 60; i++) {
                stars.push({ x: Math.random() * 720, y: Math.random() * 520, s: 0.5 + Math.random() * 1.5, sp: 0.5 + Math.random() * 2 });
            }

            function spawnAsteroid() {
                var r = 16 + Math.random() * 22;
                asteroids.push({
                    x: r + Math.random() * (720 - 2 * r),
                    y: -40,
                    r: r,
                    vy: 2 + Math.random() * 3.5 + (score / 400),
                    rot: Math.random() * Math.PI * 2,
                    vrot: (Math.random() - 0.5) * 0.08,
                    pts: 6 + Math.floor(Math.random() * 4)
                });
            }

            function spawnExplosion(x, y, color, count) {
                for (var i = 0; i < (count || 12); i++) {
                    var angle = Math.random() * Math.PI * 2;
                    var speed = 1.5 + Math.random() * 4;
                    particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: color || '#f97316',
                        life: 1.0,
                        decay: 0.03 + Math.random() * 0.03
                    });
                }
            }

            function update() {
                if (!isPlaying) return;

                // Move Stars
                stars.forEach(function(st) {
                    st.y += st.sp;
                    if (st.y > 520) { st.y = 0; st.x = Math.random() * 720; }
                });

                // Move Ship
                if (keys['ArrowLeft'] || keys['KeyA']) ship.x -= ship.speed;
                if (keys['ArrowRight'] || keys['KeyD']) ship.x += ship.speed;
                ship.x = Math.max(24, Math.min(720 - 24, ship.x));

                // Move Lasers
                for (var l = lasers.length - 1; l >= 0; l--) {
                    var laz = lasers[l];
                    laz.y -= 12;
                    if (laz.y < -20) lasers.splice(l, 1);
                }

                // Spawn Asteroids
                if (Math.random() < 0.035) spawnAsteroid();

                // Move Asteroids & Collisions
                for (var a = asteroids.length - 1; a >= 0; a--) {
                    var ast = asteroids[a];
                    ast.y += ast.vy;
                    ast.rot += ast.vrot;

                    // Laser hits asteroid
                    for (var li = lasers.length - 1; li >= 0; li--) {
                        var lz = lasers[li];
                        var dist = Math.hypot(lz.x - ast.x, lz.y - ast.y);
                        if (dist < ast.r + 4) {
                            spawnExplosion(ast.x, ast.y, '#38bdf8', 14);
                            lasers.splice(li, 1);
                            asteroids.splice(a, 1);
                            score += 25;
                            hudScore.innerText = score;
                            break;
                        }
                    }

                    if (!asteroids[a]) continue;

                    // Ship collision with asteroid
                    var shipDist = Math.hypot(ship.x - ast.x, ship.y - ast.y);
                    if (shipDist < ast.r + 16) {
                        spawnExplosion(ship.x, ship.y, '#f43f5e', 20);
                        asteroids.splice(a, 1);
                        shields--;
                        updateShieldsHUD();

                        if (shields <= 0) {
                            gameOver();
                            return;
                        }
                    } else if (ast.y > 560) {
                        asteroids.splice(a, 1);
                        score += 5;
                        hudScore.innerText = score;
                    }
                }

                // Update particles
                for (var p = particles.length - 1; p >= 0; p--) {
                    var pt = particles[p];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life -= pt.decay;
                    if (pt.life <= 0) particles.splice(p, 1);
                }
            }

            function render() {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, 720, 520);

                // Stars
                ctx.fillStyle = '#f8fafc';
                stars.forEach(function(st) {
                    ctx.globalAlpha = 0.3 + (st.s / 2);
                    ctx.fillRect(st.x, st.y, st.s, st.s);
                });
                ctx.globalAlpha = 1;

                // Lasers
                ctx.fillStyle = '#ec4899';
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 10;
                lasers.forEach(function(lz) {
                    ctx.fillRect(lz.x - 2, lz.y, 4, 16);
                });
                ctx.shadowBlur = 0;

                // Asteroids
                asteroids.forEach(function(ast) {
                    ctx.save();
                    ctx.translate(ast.x, ast.y);
                    ctx.rotate(ast.rot);
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, ast.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });

                // Ship
                if (isPlaying) {
                    ctx.save();
                    ctx.translate(ship.x, ship.y);

                    // Thruster
                    ctx.fillStyle = (Math.random() > 0.5) ? '#f97316' : '#facc15';
                    ctx.beginPath();
                    ctx.moveTo(-5, 14);
                    ctx.lineTo(5, 14);
                    ctx.lineTo(0, 24 + Math.random() * 6);
                    ctx.fill();

                    // Hull
                    ctx.fillStyle = '#0284c7';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -18);
                    ctx.lineTo(16, 14);
                    ctx.lineTo(0, 8);
                    ctx.lineTo(-16, 14);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // Particles
                particles.forEach(function(pt) {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = Math.max(0, pt.life);
                    ctx.fillRect(pt.x, pt.y, 3, 3);
                });
                ctx.globalAlpha = 1;
            }

            function updateShieldsHUD() {
                var hearts = '';
                for (var i = 0; i < shields; i++) hearts += '❤️';
                hudShields.innerText = hearts || '💀';
            }

            function fireLaser() {
                if (!isPlaying) return;
                lasers.push({ x: ship.x - 12, y: ship.y - 10 });
                lasers.push({ x: ship.x + 12, y: ship.y - 10 });
            }

            function startGame() {
                score = 0;
                shields = 3;
                ship.x = 360;
                lasers = [];
                asteroids = [];
                particles = [];
                hudScore.innerText = '0';
                updateShieldsHUD();
                isPlaying = true;
                startOverlay.style.display = 'none';
            }

            function gameOver() {
                isPlaying = false;
                if (score > highScore) {
                    highScore = score;
                    hudBest.innerText = highScore;
                    try { localStorage.setItem('space_dodger_high', highScore); } catch(e) {}
                }

                // Bridge to Game Hub Server Leaderboard
                if (window.parent && window.parent.GameHubBridge) {
                    window.parent.GameHubBridge.submitScore(score);
                }

                document.querySelector('.overlay-title').innerText = 'MISSION FAILED';
                document.querySelector('.overlay-sub').innerText = 'Final Score: ' + score + ' pts. Ready for another run?';
                startBtn.innerText = 'PLAY AGAIN';
                startOverlay.style.display = 'flex';
            }

            function loop() {
                update();
                render();
                requestAnimationFrame(loop);
            }

            // Event Listeners
            startBtn.addEventListener('click', startGame);

            window.addEventListener('keydown', function(e) {
                keys[e.code] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    fireLaser();
                }
            });

            window.addEventListener('keyup', function(e) {
                keys[e.code] = false;
            });

            canvas.addEventListener('mousemove', function(e) {
                if (!isPlaying) return;
                var rect = canvas.getBoundingClientRect();
                ship.x = (e.clientX - rect.left) * (720 / rect.width);
            });

            canvas.addEventListener('mousedown', function() {
                fireLaser();
            });

            canvas.addEventListener('touchmove', function(e) {
                if (!isPlaying || !e.touches[0]) return;
                var rect = canvas.getBoundingClientRect();
                ship.x = (e.touches[0].clientX - rect.left) * (720 / rect.width);
                e.preventDefault();
            });

            canvas.addEventListener('touchstart', function(e) {
                fireLaser();
            });

            loop();
        })();
    </script>
</body>
</html>
