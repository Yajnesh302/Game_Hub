<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Retro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #030712;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 560px;
            max-width: 95vw;
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .hud-item {
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .hud-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #34d399;
            margin-left: 6px;
        }

        .game-canvas-wrapper {
            position: relative;
            width: 560px;
            height: 560px;
            max-width: 95vw;
            max-height: 75vh;
            border: 2px solid #059669;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
            overflow: hidden;
            background: #020617;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .overlay-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: #34d399;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.6);
        }

        .overlay-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
            max-width: 400px;
            line-height: 1.5;
        }

        .btn-play {
            background: linear-gradient(135deg, #059669, #34d399);
            color: #030712;
            font-size: 1.15rem;
            font-weight: 800;
            border: none;
            padding: 12px 36px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(52, 211, 153, 0.5);
            transition: transform 0.15s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="hud-bar">
        <div class="hud-item">SCORE: <span class="hud-value" id="hud-score">0</span></div>
        <div class="hud-item">LENGTH: <span class="hud-value" id="hud-len" style="color: #38bdf8;">3</span></div>
        <div class="hud-item">BEST: <span class="hud-value" id="hud-best" style="color: #fbbf24;">0</span></div>
    </div>

    <div class="game-canvas-wrapper">
        <canvas id="gameCanvas" width="560" height="560"></canvas>
        <div class="overlay-screen" id="overlay">
            <h1 class="overlay-title" id="overlay-title">NEON SNAKE RETRO</h1>
            <p class="overlay-desc" id="overlay-desc">Slither through the grid, collect high-voltage plasma orbs, and grow your cyber tail without colliding with walls or yourself!</p>
            <button class="btn-play" id="btn-start">START GAME</button>
            <div class="controls-hint">Use Arrow Keys or WASD (Swipe on mobile)</div>
        </div>
    </div>

    <script>
        (function() {
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            var overlay = document.getElementById('overlay');
            var overlayTitle = document.getElementById('overlay-title');
            var overlayDesc = document.getElementById('overlay-desc');
            var btnStart = document.getElementById('btn-start');
            var hudScore = document.getElementById('hud-score');
            var hudLen = document.getElementById('hud-len');
            var hudBest = document.getElementById('hud-best');

            var GRID_SIZE = 20; // 28 x 28 grid
            var COLS = 28;
            var ROWS = 28;

            var snake = [];
            var dir = { x: 1, y: 0 };
            var nextDir = { x: 1, y: 0 };
            var food = { x: 14, y: 14 };
            var isPlaying = false;
            var score = 0;
            var highScore = 0;
            var particles = [];

            try { highScore = parseInt(localStorage.getItem('neon_snake_high') || 0, 10); } catch(e) {}
            hudBest.innerText = highScore;

            var lastTick = 0;
            var tickInterval = 100; // ms per move

            function spawnFood() {
                var valid = false;
                while (!valid) {
                    food.x = Math.floor(Math.random() * COLS);
                    food.y = Math.floor(Math.random() * ROWS);
                    valid = !snake.some(function(seg) { return seg.x === food.x && seg.y === food.y; });
                }
            }

            function spawnParticles(x, y, color, count) {
                for (var i = 0; i < (count || 10); i++) {
                    var ang = Math.random() * Math.PI * 2;
                    var sp = 1 + Math.random() * 3;
                    particles.push({
                        x: x * GRID_SIZE + GRID_SIZE / 2,
                        y: y * GRID_SIZE + GRID_SIZE / 2,
                        vx: Math.cos(ang) * sp,
                        vy: Math.sin(ang) * sp,
                        color: color,
                        life: 1.0,
                        decay: 0.04 + Math.random() * 0.03
                    });
                }
            }

            function startGame() {
                snake = [
                    { x: 10, y: 14 },
                    { x: 9, y: 14 },
                    { x: 8, y: 14 }
                ];
                dir = { x: 1, y: 0 };
                nextDir = { x: 1, y: 0 };
                score = 0;
                tickInterval = 100;
                hudScore.innerText = '0';
                hudLen.innerText = '3';
                particles = [];
                spawnFood();
                isPlaying = true;
                overlay.style.display = 'none';
                lastTick = performance.now();
            }

            function gameOver() {
                isPlaying = false;
                if (score > highScore) {
                    highScore = score;
                    hudBest.innerText = highScore;
                    try { localStorage.setItem('neon_snake_high', highScore); } catch(e) {}
                }

                // Submit to Game Hub Leaderboard via Bridge!
                if (window.parent && window.parent.GameHubBridge) {
                    window.parent.GameHubBridge.submitScore(score);
                }

                overlayTitle.innerText = "GAME OVER";
                overlayDesc.innerText = "You crashed! Final score: " + score + " pts. Length: " + snake.length;
                btnStart.innerText = "PLAY AGAIN";
                overlay.style.display = 'flex';
            }

            function update(time) {
                if (!isPlaying) return;

                if (time - lastTick > tickInterval) {
                    lastTick = time;
                    dir = nextDir;

                    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

                    // Wall Collision
                    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                        spawnParticles(snake[0].x, snake[0].y, '#f43f5e', 24);
                        gameOver();
                        return;
                    }

                    // Self Collision
                    for (var i = 0; i < snake.length; i++) {
                        if (snake[i].x === head.x && snake[i].y === head.y) {
                            spawnParticles(head.x, head.y, '#f43f5e', 24);
                            gameOver();
                            return;
                        }
                    }

                    snake.unshift(head);

                    // Eat Food
                    if (head.x === food.x && head.y === food.y) {
                        score += 10;
                        hudScore.innerText = score;
                        hudLen.innerText = snake.length;
                        spawnParticles(food.x, food.y, '#ec4899', 16);
                        spawnFood();
                        tickInterval = Math.max(55, 100 - Math.floor(score / 50) * 4); // Speed up
                    } else {
                        snake.pop();
                    }
                }

                // Particles update
                for (var p = particles.length - 1; p >= 0; p--) {
                    var pt = particles[p];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life -= pt.decay;
                    if (pt.life <= 0) particles.splice(p, 1);
                }
            }

            function render() {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, 560, 560);

                // Grid lines
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 1;
                for (var c = 0; c <= COLS; c++) {
                    ctx.beginPath();
                    ctx.moveTo(c * GRID_SIZE, 0);
                    ctx.lineTo(c * GRID_SIZE, 560);
                    ctx.stroke();
                }
                for (var r = 0; r <= ROWS; r++) {
                    ctx.beginPath();
                    ctx.moveTo(0, r * GRID_SIZE);
                    ctx.lineTo(560, r * GRID_SIZE);
                    ctx.stroke();
                }

                // Food
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Snake Body
                for (var s = 0; s < snake.length; s++) {
                    var seg = snake[s];
                    var isHead = (s === 0);

                    ctx.shadowColor = isHead ? '#34d399' : '#059669';
                    ctx.shadowBlur = isHead ? 15 : 8;
                    ctx.fillStyle = isHead ? '#6ee7b7' : '#10b981';

                    var pad = isHead ? 1 : 2;
                    ctx.fillRect(seg.x * GRID_SIZE + pad, seg.y * GRID_SIZE + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2);
                }
                ctx.shadowBlur = 0;

                // Particles
                particles.forEach(function(pt) {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = Math.max(0, pt.life);
                    ctx.fillRect(pt.x, pt.y, 3, 3);
                });
                ctx.globalAlpha = 1;
            }

            function loop(time) {
                update(time);
                render();
                requestAnimationFrame(loop);
            }

            // Keyboard input
            window.addEventListener('keydown', function(e) {
                if (['ArrowUp', 'KeyW'].indexOf(e.code) !== -1 && dir.y === 0) nextDir = { x: 0, y: -1 };
                else if (['ArrowDown', 'KeyS'].indexOf(e.code) !== -1 && dir.y === 0) nextDir = { x: 0, y: 1 };
                else if (['ArrowLeft', 'KeyA'].indexOf(e.code) !== -1 && dir.x === 0) nextDir = { x: -1, y: 0 };
                else if (['ArrowRight', 'KeyD'].indexOf(e.code) !== -1 && dir.x === 0) nextDir = { x: 1, y: 0 };
            });

            // Touch input
            var touchStartX = 0;
            var touchStartY = 0;
            canvas.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });

            canvas.addEventListener('touchend', function(e) {
                var dx = e.changedTouches[0].clientX - touchStartX;
                var dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 20 && dir.x === 0) nextDir = { x: 1, y: 0 };
                    else if (dx < -20 && dir.x === 0) nextDir = { x: -1, y: 0 };
                } else {
                    if (dy > 20 && dir.y === 0) nextDir = { x: 0, y: 1 };
                    else if (dy < -20 && dir.y === 0) nextDir = { x: 0, y: -1 };
                }
            });

            btnStart.addEventListener('click', startGame);
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
